meters:
- name: conversation_minutes
  description: Minutes of voice agent conversation, billed per minute.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - agent
- name: managed_stt_minutes
  description: Speech-to-text minutes on Layercode-managed keys, folded into the per-minute rate.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - agent
- name: managed_tts_minutes
  description: Text-to-speech minutes on Layercode-managed keys, folded into the per-minute rate.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - agent
- name: telephony_minutes
  description: Phone (Twilio) minutes for inbound/outbound calls; billed via provider account under BYOK.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - agent
principles:
- name: Visibility
  description: Pull Layercode usage exports and per-session duration; inspect per-agent minute burn.
- name: Allocation
  description: Tag agents per workload/team; map session minutes to internal cost centers.
- name: Optimization
  description: Tune turn-taking and latency settings to shorten calls; choose BYOK vs managed STT/TTS for best effective per-minute cost.
- name: Accountability
  description: Assign owners per agent; review monthly minute spend against budget.
