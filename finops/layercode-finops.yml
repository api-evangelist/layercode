description: >-
  FinOps view of Layercode spend. Layercode bills usage-based per-minute rates
  for voice agent conversations. When using Layercode-managed STT (Deepgram)
  and TTS (ElevenLabs, Cartesia, Rime) keys, those costs are folded into the
  per-minute rate; with bring-your-own-keys (BYOK), STT/TTS and telephony are
  billed directly through your own provider accounts. Exact per-minute rates
  are not reconciled here.
notes: >-
  Per-minute rates and free allowances are subject to change and differ by
  managed vs BYOK configuration; verify against the Layercode pricing page
  during reconciliation.
