  bring-your-own-keys (BYOK), where the underlying STT/TTS and any telephony
  costs are billed directly through your provider accounts. Exact per-minute
  rates, free-tier minutes, and tier thresholds are not reconciled in this
  artifact and should be verified on the Layercode pricing page.
