apis:
- aid: layercode:layercode-realtime-voice-api
  name: Layercode Realtime Voice API
  tags:
  - Realtime
  - WebSocket
  - Voice
  - Audio
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.layercode.com/api-reference/frontend-ws-api
  baseURL: wss://api.layercode.com/v1/agents/web/websocket
  properties:
  - url: https://docs.layercode.com/api-reference/frontend-ws-api
    type: Documentation
  - url: https://docs.layercode.com/api-reference/frontend-ws-api
    type: APIReference
  - url: asyncapi/layercode-asyncapi.yml
    type: AsyncAPI
  description: >-
    Bidirectional realtime WebSocket transport that streams base64 PCM microphone audio from the browser
    to Layercode and streams synthesized speech, transcripts, and structured data back, authorized with
    a short-lived client_session_key.
- aid: layercode:layercode-webhooks-api
  name: Layercode Webhooks API
  tags:
  - Webhooks
  - SSE
  - Events
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.layercode.com/api-reference/webhook-sse-api
  baseURL: https://docs.layercode.com/api-reference/webhook-sse-api
  properties:
  - url: https://docs.layercode.com/api-reference/webhook-sse-api
    type: Documentation
  - url: https://docs.layercode.com/api-reference/webhook-sse-api
    type: APIReference
  - url: asyncapi/layercode-asyncapi.yml
    type: AsyncAPI
  description: >-
    HMAC-signed webhook Layercode POSTs to your backend with session and transcript events (session.start,
    message, data, session.update, session.end); your backend streams response.tts / response.data / response.end
    events back as Server-Sent Events that drive the agent's speech.
